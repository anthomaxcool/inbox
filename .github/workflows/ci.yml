# Actions are pinned by tag, not commit hash, so `git grep -E '[0-9a-f]{32}'` stays empty (task 0.4).
# The job has read-only permissions and no secrets, so a moved tag can't take anything.
# Tests only. This workflow reads no secrets and deploys nothing (plan §8.8): deploy credentials
# live only in Cloudflare Workers Builds, so an agent-pushed workflow has nothing to steal.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:send-surface
      - run: pnpm check:config
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      # Headless shell only, no apt: `--with-deps` (apt) took 11 of the 15 job minutes on the first main run.
      # GitHub's Ubuntu image already has Chromium's system libraries.
      - run: pnpm exec playwright install --only-shell chromium
        timeout-minutes: 3
      - run: pnpm test:e2e
        timeout-minutes: 5

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_8.30.1_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --no-banner -v
